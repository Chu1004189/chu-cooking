<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHU dot COOKING | 俺のメシが、一番うまい！</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- オープニングアニメーション (JSで初回アクセス時のみ制御) -->
  <div id="opening-anim" class="opening-anim">
    <div class="opening-content">
      <span class="opening-logo">CHU dot COOKING</span>
    </div>
  </div>

  <!-- ヘッダー -->
  <header class="header">
    <div class="header-inner">
      <a href="index.html#top" class="site-logo">CHU dot COOKING</a>
      <nav class="nav">
        <ul>
          <li><a href="index.html#top">HOME</a></li>
          <li><a href="index.html#about">ABOUT</a></li>
          <li><a href="index.html#recipes">レシピ</a></li>
          <li><a href="index.html#tags">気分は？</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <!-- ヒーローエリア -->
    <section id="top" class="hero">
      <div class="hero-inner">
        <div class="hero-text-content">
          <p class="hero-sub">MY KITCHEN / MY RULES</p>
          <h1 class="hero-title">
            俺の作る<br>
            メシが、<br>
            一番うまい！
          </h1>
          <p class="hero-catch">COOK IT. EAT IT. LOVE IT.</p>
        </div>
        <!-- テキストの右背面にかぶる画像 -->
        <div class="hero-img-wrap">
          <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=1000&q=80" alt="料理画像" class="hero-img">
        </div>
      </div>
    </section>

    <!-- ABOUT ME / FOOD -->
    <section id="about" class="about-section">
      <div class="about-inner">
        <p class="about-sub">ABOUT ME / FOOD</p>
        <h2 class="about-title">
          うまいものは、<br>
          自分で作る。
        </h2>
      </div>
    </section>

    <!-- 検索 & タグエリア -->
    <section id="tags" class="filter-section">
      <div class="filter-inner">
        <h2 class="section-title">今日の<br>気分は？</h2>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="キーワード・材料で検索...">
        </div>
        <div class="tag-cloud" id="tag-cloud">
          <!-- JSでタグ生成 -->
        </div>
      </div>
    </section>

    <!-- レシピ一覧 -->
    <section id="recipes" class="recipes-section">
      <!-- 動きを速く・数を増やした背景アニメーション要素 -->
      <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
        <div class="shape shape-6"></div>
        <div class="shape shape-7"></div>
        <div class="shape shape-8"></div>
        <div class="shape shape-9"></div>
        <div class="shape shape-10"></div>
      </div>

      <div class="recipes-inner">
        <h2 class="section-title">RECIPES</h2>
        <div class="recipe-grid" id="recipe-grid">
          <!-- JSでレシピカードを生成 -->
        </div>
      </div>
    </section>

    <!-- 最下部 (FINAL CTA) エリア -->
    <section class="final-cta">
      <div class="cta-inner">
        <h2 class="cta-title">今日も 俺のメシがうまい！</h2>
      </div>
    </section>
  </main>

  <!-- フッター -->
  <footer class="footer">
    <p>&copy; CHU dot COOKING All Rights Reserved.</p>
  </footer>

  <!-- レシピ詳細 モーダル -->
  <div class="modal" id="recipe-modal">
    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="modal-content" id="modal-content">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="modal-body" id="modal-body">
        <!-- JSで動的生成（ガスコンロ・家電・特記事項削除済み） -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
